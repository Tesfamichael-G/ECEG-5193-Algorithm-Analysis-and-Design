site_name: ECEG-4192 — Data Structures
site_description: BSc Electrical Engineering (Computer) · Semester VII · Module Data Storage and Analysis
site_author: Your Name
site_url: https://tesfamichael-g.github.io/ECEG-5193-Algorithm Analysis and Design/
repo_name: YOUR-USERNAME/ECEG-4192

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/file-tree
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Chapters:
      - 1. Introduction: chapters/01-introduction.md
      - 2. Relational Model: chapters/02-relational-model.md
      - 3. ER Modelling: chapters/03-er-modeling.md
      - 4. Logical Design: chapters/04-logical-design.md
      - 5. Relational Algebra: chapters/05-relational-algebra.md
      - 6. SQL: chapters/06-sql.md
      - 7. Storage and Hashing: chapters/07-storage-hashing.md
  - Slides:
      - 1. Introduction: slides/01-introduction.md
      - 2. Relational Model: slides/02-relational-model.md
      - 3. ER Modelling: slides/03-er-modeling.md
      - 4. Logical Design: slides/04-logical-design.md
      - 5. Relational Algebra: slides/05-relational-algebra.md
      - 6. SQL: slides/06-sql.md
      - 7. Storage and Hashing: slides/07-storage-hashing.md
  - Solutions:
      - Overview: solutions/index.md
      - 1. Introduction: solutions/01-introduction.md
      - 2. Relational Model: solutions/02-relational-model.md
      - 3. ER Modelling: solutions/03-er-modeling.md
      - 4. Logical Design: solutions/04-logical-design.md
      - 5. Relational Algebra: solutions/05-relational-algebra.md
      - 6. SQL: solutions/06-sql.md
      - 7. Storage and Hashing: solutions/07-storage-hashing.md
  - Exam Bank: exam-bank.md
  - Assessment: assessment.md
  - Resources: resources.md
  - Feedback: feedback.md
  - Exam Bank: exam-bank.md
  - Assessment: assessment.md
  - Resources: resources.md
  - Feedback: feedback.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['dollar', 'round']
      block_syntax: ['dollar', 'square']
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js